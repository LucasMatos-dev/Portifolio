<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Automação de Luzes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./assets/css/style.css">
</head>

<body class="bg-light">

    <div class="container py-5">
        <h1 class="text-center mb-4">Automação de Luzes</h1>

        <div class="row mb-4 justify-content-center">
            <div class="col-auto">
                <button class="btn btn-success" data-comodo="quarto" data-acao="ligar">Ligar Quarto</button>
                <button class="btn btn-danger" data-comodo="quarto" data-acao="desligar">Desligar Quarto</button>
            </div>
            <div class="col-auto">
                <button class="btn btn-success" data-comodo="sala" data-acao="ligar">Ligar Sala</button>
                <button class="btn btn-danger" data-comodo="sala" data-acao="desligar">Desligar Sala</button>
            </div>
        </div>

        <div class="row mb-4">
            <div class="col-12 text-center">
                <div id="status" class="fw-bold"></div>
            </div>
        </div>

        <div class="row g-4">
            <div class="col-md-6">
                <div id="quarto" class="comodo">Quarto</div>
            </div>
            <div class="col-md-6">
                <div id="sala" class="comodo">Sala</div>
            </div>
        </div>
    </div>

    <script src="./assets/script/centralDeLuzes.js"></script>
</body>

</html>
