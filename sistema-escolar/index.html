<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login • Sistema Escolar</title>
    <link rel="stylesheet" href="./assets/css/dashboard.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="login-container">
        <!-- Left Side: Image/Brand -->
        <div class="login-image">
            <h2>EdTech School</h2>
            <p>Transformando o futuro da educação.</p>
        </div>

        <!-- Right Side: Form -->
        <div class="login-form-wrapper">
            <a href="../index.html" class="back-link">← Voltar ao Portfólio</a>

            <div class="form-box">
                <h1 class="form-title">Bem-vindo de volta</h1>

                <form id="login-form">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="ex: aluno@escola.com" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Senha</label>
                        <input type="password" id="password" name="password" placeholder="••••••••" required>
                    </div>

                    <p id="error" class="error-message"></p>

                    <button type="submit" class="btn">Entrar no Sistema</button>
                </form>
            </div>
        </div>
    </div>

    <script src="./assets/js/usuario.js"></script>
    <script src="./assets/js/aluno.js"></script>
    <script src="./assets/js/professor.js"></script>
    <script src="./assets/js/auth.js"></script>
</body>

</html>
